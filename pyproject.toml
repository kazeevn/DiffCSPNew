[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffcsp"
version = "0.2.0"
description = "DiffCSP++: Crystal Structure Prediction via Space Group Constrained Diffusion with MLIP Backbone"
readme = "README.md"
authors = [{ name = "Nikita Kazeev", email = "kazeevn@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pymatgen>=2023.0.0",
    "pyxtal>=1.0.6",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
orb = [
    "orb-models>=0.5.0",
    "ase>=3.22.0",
]
wandb = [
    "wandb>=0.16.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
diffcsp-train = "diffcsp.cli.train:main"
diffcsp-inference = "diffcsp.cli.inference:main"

[tool.hatch.build.targets.wheel]
packages = ["diffcsp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.isort]
known-first-party = ["diffcsp"]
